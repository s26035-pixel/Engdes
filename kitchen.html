<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>【スマホ版】学食 提供・売り切れ状況</title>
    <style>
        /* 全体の雰囲気を優しく */
        body { 
            margin: 0; padding: 0; 
            background-color: #efede8; /* 薄いクリーム色 */
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif; /* 丸ゴシック体 */
            color: #555; /* 少し柔らかい黒 */
            padding-bottom: 80px; 
        }
        
        /* ヘッダーをおそろいのかわいさに */
        .header { 
            background: linear-gradient(135deg, #eceae9, #f6f2ee); /* グレージュ系のグラデに統一 */
            color: #ee9c59; 
            padding: 18px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: bold; 
            position: sticky; /* スクロール時に上部に固定されるように追加 */
            top: 0; 
            z-index: 100; 
            border-radius: 0 0 20px 20px; /* 下だけ丸く */
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }
        
        .container { padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        
        /* タイトルエリア */
        .title-area { 
            position: relative;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        /* タイトルをかわいく */
        .section-title { 
            font-size: 19px; 
            font-weight: bold; 
            color: #ff8a65;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            background-color: #eac48c;
            border-radius: 4px;
        }
        
        /* ⏰ 時刻バッジを真ん中に配置するためのラッパー */
        .time-center-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: -5px;
            width: 100%;
        }

        /* 🎀 真ん中に出てくる時刻表示エリア（他画面とデザイン完全同期） */
        #update-time {
            font-size: 24px; /* 文字を大きく太く */
            color: #060302; /* 濃い黒でハッキリ */
            font-weight: 900;
            background: #f5faf9; /* 少し濃いめのパステル苺ミルク色 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 30px; /* 文字が隠れないようにゆったり幅 */
            border-radius: 20px; 
            box-shadow: 0 4px 6px rgba(255, 138, 101, 0.15); 
            border: 2.5px dashed #060302; /* 点線をくっきり太く */
            min-width: 80px; /* 横幅をしっかり確保 */
            text-align: center;
            z-index: 10;
        }

        /* 提供状況カードのデザイン */
        .card-row { display: flex; gap: 12px; }
        .card { 
            flex: 1; 
            background: #fff; 
            border-radius: 18px; 
            border-top: 6px solid; 
            padding: 15px 10px; 
            text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
        }
        /* パステル系の優しめボーダーカラー */
        .card.orange { border-color: #eebe5f; } 
        .card.green { border-color: #68ca6b; }
        
        .card-title { font-weight: bold; margin-bottom: 8px; font-size: 16px; color: #444; }
        .card-time { font-size: 26px; font-weight: 900; color: #0e0908; }
        .card-wait { font-size: 13px; margin-top: 5px; font-weight: bold; color: #888; transition: color 0.5s ease; }
        .status-img { width: 60px; height: auto; margin-top: 8px; }
        
        /* 売り切れ情報ボックス */
        .soldout-box { 
            background: #fff; 
            border-radius: 18px; 
            border-top: 6px solid #ffffff; /* いちご赤 */
            padding: 18px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            border-left: 1px solid #fff3e0;
            border-right: 1px solid #fff3e0;
            border-bottom: 1px solid #fff3e0;
        }
        .soldout-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px dashed #e9e5dd; 
            padding: 10px 4px; 
            font-size: 15px; 
            font-weight: bold; 
            color: #555;
        }
        .soldout-item:last-child { border-bottom: none; }
        .badge { 
            background: #0b0a0a; 
            color: #fff; 
            padding: 3px 10px; 
            border-radius: 20px; 
            font-size: 11px; 
            box-shadow: 0 2px 4px rgba(239, 154, 154, 0.3);
        }
    
        /* フッターナビをおそろいのかわいさに */
        .footer-nav {
            position: fixed;
            bottom: 10px; 
            left: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.95); 
            display: flex;
            justify-content: space-around;
            border-radius: 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            padding: 5px 0;
            backdrop-filter: blur(5px); 
        }
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            text-decoration: none;
            color: #bbb; 
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            position: relative;
            transition: color 0.3s;
        }
        .nav-item .icon { font-size: 24px; transition: transform 0.3s; }
        .nav-item.active { color: #2b1711; font-weight: bold; } /* 深い茶黒系に完全同期 */
        .nav-item.active .icon { transform: translateY(-5px) scale(1.1); }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            width: 15px;
            height: 3px;
            background-color: #ede4e1;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="header">🍽️ 高専品川 学生食堂ナビ<span class="experiment-badge"> 実証実験中</span></div>
    <div class="container">
        
        <!-- ⏰ ヘッダーとタイトルの間に中央寄せで配置 -->
        <div class="time-center-container">
            <div id="update-time">--:--</div>
        </div>
        
        <!-- タイトルエリア -->
        <div class="title-area">
            <div class="section-title">🕒 メニュー別 提供状況</div>
        </div>

        <div class="card-row">
            <div class="card orange">
                <div class="card-title">🍚 丼もの</div>
                <div class="card-time"><span id="don_time">0</span>分</div>
                <div class="card-wait" id="don_wait_text"><span id="don_people">0</span>人待ち</div>
                <img id="don_image" class="status-img" src="lv1.png" alt="">
            </div>
            <div class="card green">
                <div class="card-title">🍜 麺類</div>
                <div class="card-time"><span id="noodle_time">0</span>分</div>
                <div class="card-wait" id="noodle_wait_text"><span id="noodle_people">0</span>人待ち</div>
                <img id="noodle_image" class="status-img" src="lv1.png" alt="">
            </div>
        </div>
        
        <div>
            <div class="section-title">⚠️ 売り切れ情報 ⚠️</div>
            <div class="soldout-box" id="soldout_container"></div>
        </div>

        <div style="text-align:center; padding: 10px 0; color:#aaa; font-size:12px; font-weight: 500;">データは3秒ごとに自動更新されます</div>
    </div>

<script>
    function padZero(num) {
        return num.toString().padStart(2, '0');
    }

    function loadMobileData() {
        Promise.all([
            fetch('data.json?' + new Date().getTime()).then(res => res.json()).catch(() => ({})),
            fetch('menu.json?' + new Date().getTime()).then(res => res.json()).catch(() => ([])),
            // GitHub PagesではPHPが動かないため、エラー時は空配列を返して止まらないようにする
            fetch('kitchen_api.php?' + new Date().getTime()).then(res => res.json()).catch(() => ([]))
        ])
        .then(([adminData, menuData, ordersData]) => {
            
            let autoDonPeople = 0;    let autoDonTimeSec = 0;
            let autoNoodlePeople = 0; let autoNoodleTimeSec = 0;

            if (Array.isArray(ordersData)) {
                ordersData.forEach(order => {
                    if (order.type === 'don') { 
                        autoDonPeople += 1; 
                        autoDonTimeSec += (order.cook_time || 0); 
                    } else if (order.type === 'noodle') { 
                        autoNoodlePeople += 1; 
                        autoNoodleTimeSec += (order.cook_time || 0); 
                    }
                });
            }

            // data.json の人数（手動設定値）と API の注文人数を合算する
            let finalDonPeople = autoDonPeople + (adminData.don?.people || 0);
            let finalNoodlePeople = autoNoodlePeople + (adminData.noodle?.people || 0);

            let finalDonTime = Math.ceil(autoDonTimeSec / 60) + (adminData.don?.time || 0);
            let finalNoodleTime = Math.ceil(autoNoodleTimeSec / 60) + (adminData.noodle?.time || 0);

            document.getElementById('don_people').innerText = finalDonPeople; 
            document.getElementById('don_time').innerText = finalDonTime;
            document.getElementById('noodle_people').innerText = finalNoodlePeople; 
            document.getElementById('noodle_time').innerText = finalNoodleTime;

            // マイルドなパステル警告カラー（合算後の人数でアイコンと色も切り替え）
            const THRESHOLD_LV2 = 5, THRESHOLD_LV3 = 10, COLOR_LV2 = '#ffb74d', COLOR_LV3 = '#e57373';
            
            let donImg = document.getElementById('don_image'), donText = document.getElementById('don_wait_text');
            if (finalDonPeople >= THRESHOLD_LV3) { donImg.src = 'lv3.png'; donText.style.color = COLOR_LV3; }
            else if (finalDonPeople >= THRESHOLD_LV2) { donImg.src = 'lv2.png'; donText.style.color = COLOR_LV2; }
            else { donImg.src = 'lv1.png'; donText.style.color = '#ffb74d'; }

            let noodleImg = document.getElementById('noodle_image'), noodleText = document.getElementById('noodle_wait_text');
            if (finalNoodlePeople >= THRESHOLD_LV3) { noodleImg.src = 'lv3.png'; noodleText.style.color = COLOR_LV3; }
            else if (finalNoodlePeople >= THRESHOLD_LV2) { noodleImg.src = 'lv2.png'; noodleText.style.color = COLOR_LV2; }
            else { noodleImg.src = 'lv1.png'; noodleText.style.color = '#a5d6a7'; }

            let soldoutContainer = document.getElementById('soldout_container');
            soldoutContainer.innerHTML = ''; 
            let soldoutCount = 0;
            
            let today = new Date().getDay();

            if (Array.isArray(menuData)) {
                menuData.forEach(menu => {
                    if (menu.available_days && menu.available_days.includes(today)) {
                        if (menu.soldout === true) {
                            soldoutContainer.innerHTML += `
                                <div class="soldout-item">
                                    <span>${menu.name}</span><span class="badge">売り切れ</span>
                                </div>`;
                            soldoutCount++;
                        }
                    }
                });
            }

            if (soldoutCount === 0) {
                soldoutContainer.innerHTML = '<div style="text-align:center; color:#888; font-size:14px; padding:10px 0;">🎉 現在売り切れはありません</div>';
            }

            // 💡 3秒ごとの自動更新に合わせて中央のバッジ時刻を自動書き換え
            let now = new Date();
            let timeStr = padZero(now.getHours()) + ':' + padZero(now.getMinutes());
            document.getElementById('update-time').innerHTML = `${timeStr}`;
        })
        .catch(error => console.log("データ読み込みエラー:", error));
    }
    
    loadMobileData(); 
    setInterval(loadMobileData, 3000);
</script>

<nav class="footer-nav">
    <a href="menu.html" class="nav-item">
        <span class="icon">📋</span>
        <span>メニュー</span>
    </a>
    <a href="vending.html" class="nav-item">
        <span class="icon">🎫</span>
        <span>券売機</span>
    </a>
    <a href="kitchen.html" class="nav-item active">
        <span class="icon">🕰️</span>
        <span>状況</span>
    </a>
    <a href="seatmap.html" class="nav-item">
        <span class="icon">🪑</span>
        <span>空席</span>
    </a>
</nav>
</body>
</html>

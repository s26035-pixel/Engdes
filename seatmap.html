<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>【スマホ版】学食 空席マップ</title>
    <style>
        /* 全体の雰囲気を優しく */
        body { 
            margin: 0; padding: 0; 
            background-color: #fffaf0; /* 薄いクリーム色 */
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif; /* 丸ゴシック体 */
            color: #555; /* 少し柔らかい黒 */
            padding-bottom: 80px; 
        }
        
        /* ヘッダーをおそろいのかわいさに */
        .header { 
            background: linear-gradient(135deg, #ffb74d, #ff8a65); /* パステルオレンジのグラデ */
            color: #fff; 
            padding: 18px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: bold; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-radius: 0 0 20px 20px; /* 下だけ丸く */
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }
        
        .container { 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }

        /* 混雑度と時刻をまとめるエリア */
        .title-container {
            position: relative;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        /* タイトルをかわいく */
        .section-title { 
            font-size: 19px; 
            font-weight: bold; 
            color: #ff8a65;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 110px; /* 時刻バッジと被らないように余白を確保 */
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            background-color: #ffb74d;
            border-radius: 4px;
        }
        
        /* 🎀 大きくなって右上に配置された時刻表示エリア */
        #update-time {
            font-size: 40px; /* 大きめサイズ */
            color: #ff7043; 
            font-weight: bold;
            background: #fff0f5; /* ほんのり苺ミルク色 */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px; /* ぷっくり丸い形 */
            box-shadow: 0 4px 6px rgba(255, 138, 101, 0.15); 
            border: 2px dashed #ffab91; /* かわいさ満点の点線デザイン */
            
            /* 右上に浮かせる */
            position: absolute;
            right: 5px;
            top: -6px;
            z-index: 10;
        }

        /* 「実証実験中」のバッジ */
        .experiment-badge { font-size: 22px; color: #fff; background: rgba(0, 0, 0, 0.25); padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 6px; vertical-align: middle; }

        .container { padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        .section-title { font-size: 18px; font-weight: bold; border-left: 5px solid #ff9800; padding-left: 10px; margin-bottom: 10px; }
        
        /* 時刻と授業までの残り時間を表示するバッジ */
        .time-badge { font-size: 13px; color: #666; font-weight: normal; margin-left: 10px; background: #eee; padding: 2px 6px; border-radius: 4px; display: inline-block; vertical-align: middle; }
        /* 残り時間（〇〇分）を少し目立たせるスタイル */
        .countdown-text { color: #ce1b22; font-weight: bold; margin-left: 5px; }

        /* マップ領域 */
        .map-box { 
            background: #fff; 
            border-radius: 18px; /* もっと丸く */
            padding: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            max-width: 320px; 
            margin: 0 auto;   
            border: 1px solid #fff3e0;
        }
        .map-wrapper { 
            position: relative; 
            width: 100%; 
            display: inline-block; 
            vertical-align: top;
        }
        .map-image { 
            width: 100%; 
            height: auto; 
            display: block; 
            border-radius: 12px; /* 画像の角も丸く */
        }

        /* 座席ピンの共通設定 */
        .table { 
            position: absolute; 
            border: 1px solid rgba(0, 0, 0, 0.15); 
            border-radius: 4px; /* ピンの角をほんのり丸く */
            transition: background-color 0.5s ease; 
            box-sizing: border-box; 
            z-index: 10; 
        }
        
        /* 🎨 優しくてかわいいステータスカラーに変更 */
        .status-0 { background-color: #2055d2; } /* 空席: ミルキーブルー */
        .status-1 { background-color: #e5b830; } /* わずか: パステルイエロー */
        .status-2 { background-color: #de4352; } /* 満席: ほんのりイチゴ赤 */
        
        /* 凡例バーをかわいく */
        .legend-bar { 
            display: flex; 
            justify-content: space-around; 
            margin-top: 15px; 
            font-size: 13px; 
            font-weight: bold; 
            background-color: #fffaf0;
            padding: 8px;
            border-radius: 10px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; color: #666; }
        .legend-color { width: 16px; height: 16px; border-radius: 5px; border: 1px solid rgba(0,0,0,0.1); }

        /* 座席配置のCSS */
        #t1{top:58%;left:70%;width:3.5%;height:4%;} #t2{top:66%;left:70%;width:3.5%;height:4%;} #t3{top:74%;left:70%;width:3.5%;height:4%;}
        #t4{top:54%;left:62%;width:3.5%;height:7%;} #t5{top:61%;left:62%;width:3.5%;height:7%;} #t6{top:68%;left:62%;width:3.5%;height:7%;} #t7{top:75%;left:62%;width:3.5%;height:7%;}
        #t8{top:54%;left:56%;width:3.5%;height:7%;} #t9{top:61%;left:56%;width:3.5%;height:7%;} #t10{top:68%;left:56%;width:3.5%;height:7%;} #t11{top:75%;left:56%;width:3.5%;height:7%;}
        #t12{top:54%;left:50%;width:3.5%;height:7%;} #t13{top:61%;left:50%;width:3.5%;height:7%;} #t14{top:68%;left:50%;width:3.5%;height:7%;} #t15{top:75%;left:50%;width:3.5%;height:7%;}
        #t16{top:54%;left:44%;width:3.5%;height:7%;} #t17{top:61%;left:44%;width:3.5%;height:7%;} #t18{top:68%;left:44%;width:3.5%;height:7%;} #t19{top:75%;left:44%;width:3.5%;height:7%;}
        #t20{top:54%;left:38%;width:3.5%;height:7%;} #t21{top:61%;left:38%;width:3.5%;height:7%;} #t22{top:68%;left:38%;width:3.5%;height:7%;} #t23{top:75%;left:38%;width:3.5%;height:7%;}
        #t24{top:54%;left:32%;width:3.5%;height:7%;} #t25{top:61%;left:32%;width:3.5%;height:7%;} #t26{top:68%;left:32%;width:3.5%;height:7%;} #t27{top:75%;left:32%;width:3.5%;height:5%;}
        #t28{top:54%;left:26%;width:3.5%;height:7%;} #t29{top:61%;left:26%;width:3.5%;height:7%;} #t30{top:68%;left:26%;width:3.5%;height:5%;}
        #t31{top:54%;left:20%;width:3.5%;height:7%;} #t32{top:61%;left:20%;width:3.5%;height:5%;}
        #t33{top:83%;left:66%;width:2.5%;height:7%;transform:rotate(68deg);} #t34{top:86%;left:55%;width:2.5%;height:7%;transform:rotate(82deg);}
        #t35{top:86%;left:41.5%;width:2.5%;height:7%;transform:rotate(99deg);} #t36{top:83%;left:30.5%;width:2.5%;height:7%;transform:rotate(113deg);}
        #t37{top:76.5%;left:19.5%;width:2.5%;height:7%;transform:rotate(129deg);} #t38{top:70%;left:11.5%;width:4%;height:3.5%;transform:rotate(143deg);}
        #t39{top:58%;left:5%;width:5%;height:3.5%;transform:rotate(160deg);} #t40{top:49.5%;left:3%;width:5%;height:3.5%;transform:rotate(172deg);}
        #t41{top:34%;left:3%;width:5%;height:3.5%;transform:rotate(190deg);}
        #t42{top:35%;left:15%;width:7%;height:3.5%;} #t43{top:42%;left:22%;width:4%;height:3.5%;} #t44{top:42%;left:12%;width:5%;height:3.5%;}
    
        /* フッターナビをおそろいのかわいさに */
        .footer-nav {
            position: fixed;
            bottom: 10px; 
            left: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.95); 
            display: flex;
            justify-content: space-around;
            border-radius: 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            padding: 5px 0;
            backdrop-filter: blur(5px); 
        }
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            text-decoration: none;
            color: #bbb; 
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            position: relative;
            transition: color 0.3s;
        }
        .nav-item .icon { 
            font-size: 24px; 
            transition: transform 0.3s;
        }
        .nav-item.active { 
            color: #ff8a65; 
            font-weight: bold; 
        }
        .nav-item.active .icon {
            transform: translateY(-5px) scale(1.1); 
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            width: 15px;
            height: 3px;
            background-color: #ff8a65;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="header">🍽️ 高専品川 学生食堂ナビ<span class="experiment-badge">実証実験中</span></div>

    <div class="container">
        <!-- 💡 タイトルと右上時刻をまとめたコンテナ -->
        <div class="title-container">
            <div class="section-title">🪑 空席マップ (混雑度: <span id="congestion_percent">0</span>%)</div>
            <!-- 右上に出るかわいいリアルタイム時刻表示エリア -->
            <div id="update-time"></div>
        </div>
        
        <p style="font-size:12px; color:#888; margin:-10px 0 5px 5px;">※画像はピンチアウトで拡大できます</p>
        
        <div class="map-box">
            <div class="map-wrapper">
                <img src="image2.png" alt="マップ背景" class="map-image">
                <div id="t1" class="table"></div><div id="t2" class="table"></div><div id="t3" class="table"></div><div id="t4" class="table"></div><div id="t5" class="table"></div><div id="t6" class="table"></div><div id="t7" class="table"></div><div id="t8" class="table"></div><div id="t9" class="table"></div><div id="t10" class="table"></div><div id="t11" class="table"></div><div id="t12" class="table"></div><div id="t13" class="table"></div><div id="t14" class="table"></div><div id="t15" class="table"></div><div id="t16" class="table"></div><div id="t17" class="table"></div><div id="t18" class="table"></div><div id="t19" class="table"></div><div id="t20" class="table"></div><div id="t21" class="table"></div><div id="t22" class="table"></div><div id="t23" class="table"></div><div id="t24" class="table"></div><div id="t25" class="table"></div><div id="t26" class="table"></div><div id="t27" class="table"></div><div id="t28" class="table"></div><div id="t29" class="table"></div><div id="t30" class="table"></div><div id="t31" class="table"></div><div id="t32" class="table"></div><div id="t33" class="table"></div><div id="t34" class="table"></div><div id="t35" class="table"></div><div id="t36" class="table"></div><div id="t37" class="table"></div><div id="t38" class="table"></div><div id="t39" class="table"></div><div id="t40" class="table"></div><div id="t41" class="table"></div><div id="t42" class="table"></div><div id="t43" class="table"></div><div id="t44" class="table"></div>
            </div>
            <div class="legend-bar">
                <div class="legend-item"><div class="legend-color status-0"></div>空席</div>
                <div class="legend-item"><div class="legend-color status-1"></div>わずか</div>
                <div class="legend-item"><div class="legend-color status-2"></div>満席</div>
            </div>
        </div>
        
        <div style="text-align:center; padding: 10px 0; color:#aaa; font-size:12px; font-weight: 500;"> データは3秒ごとに自動更新されます</div>
    </div>

<script>
    function loadMobileData() {
        fetch('data.json?' + new Date().getTime())
        .then(res => res.json())
        .then(adminData => {
            let maxScore = 0, currentScore = 0;
            
            if(adminData.seats) {
                Object.keys(adminData.seats).forEach(tableId => {
                    let status = adminData.seats[tableId];
                    let tableElement = document.getElementById(tableId);
                    
                    if (tableElement) { 
                        tableElement.className = 'table status-' + status; 
                        maxScore += 2; 
                        currentScore += status; 
                    }
                });
            }
            document.getElementById('congestion_percent').innerText = maxScore > 0 ? Math.round((currentScore / maxScore) * 100) : 0;
            
            // 💡 3秒ごとのデータ更新に合わせて、バッジ内の時刻も最新のものに書き換えます
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('update-time').innerHTML = `  ${hours}:${minutes}`;
            
        })
        .catch(error => console.log("データ読み込みエラー:", error));
    }
    
    loadMobileData(); 
    setInterval(loadMobileData, 3000);
</script>

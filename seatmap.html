    <title>【スマホ版】学食 空席マップ</title>
    <style>
        /* 全体の雰囲気を優しく */
        body { 
            margin: 0; padding: 0; 
            background-color: #efede8; /* 薄いクリーム色に統一 */
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif; /* 丸ゴシック体 */
            color: #555; /* 少し柔らかい黒 */
            padding-bottom: 80px; 
        }
        
        /* ヘッダーをおそろいのかわいさに */
        .header { 
            background: linear-gradient(135deg, #eceae9, #f6f2ee); /* グレージュ系のグラデに統一 */
            color: #ee9c59; /* 柔らかいオレンジ */
            padding: 18px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: bold; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-radius: 0 0 20px 20px; /* 下だけ丸く */
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }
        
        .container { 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }

        /* タイトルをかわいく */
        .section-title { 
            font-size: 19px; 
            font-weight: bold; 
            color: #ff8a65;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            background-color: #eac48c; /* 左の縦棒のカラーを統一 */
            border-radius: 4px;
        }
        
        /* ⏰ 時刻バッジを真ん中に配置するためのラッパー */
        .time-center-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: -5px;
            width: 100%;
        }

        /* 🎀 真ん中に出てくる時刻表示エリア（他画面とデザイン完全同期） */
        #update-time {
            font-size: 24px; /* 文字を大きく太く */
            color: #060302; /* 濃い黒でハッキリ */
            font-weight: 900;
            background: #f5faf9; /* パステルミント・ミルク色に統一 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 30px; /* 文字が隠れないようにゆったり幅 */
            border-radius: 20px; 
            box-shadow: 0 4px 6px rgba(255, 138, 101, 0.15); 
            border: 2.5px dashed #060302; /* 点線をくっきり太く */
            min-width: 80px; /* 横幅をしっかり確保 */
            text-align: center;
            z-index: 10;
        }

        /* 「実証実験中」のバッジ */
        .experiment-badge { font-size: 22px; color: #fff; background: rgba(0, 0, 0, 0.25); padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 6px; vertical-align: middle; }

        /* マップ領域 */
        .map-box { 
            background: #fff; 
            border-radius: 18px; /* もっと丸く */
            padding: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            width: 90%;          /* 画面の横幅に対して90%の大きさに広げる */
            max-width: 500px;    /* 大きくなりすぎない上限を500pxに引き上げる */
            margin: 0 auto;   
            border: 1px solid #e9e5dd;
        }
        .map-wrapper { 
            position: relative; 
            width: 100%; 
            display: inline-block; 
            vertical-align: top;
        }
        .map-image { 
            width: 100%; 
            height: auto; 
            display: block; 
            border-radius: 12px; /* 画像の角も丸く */
        }

        /* 座席ピンの共通設定 */
        .table { 
            position: absolute; 
            border: 1px solid rgba(0, 0, 0, 0.15); 
            border-radius: 4px; /* ピンの角をほんのり丸く */
            transition: background-color 0.5s ease; 
            box-sizing: border-box; 
            z-index: 10; 
        }
        
        /* 🎨 1つ目のトーンに合わせたマイルドな色合いに修正 */
        .status-0 { background-color: #0e54a4; } /* 空席: 優しいブルー */
        .status-1 { background-color: #f4b63a; } /* わずか: 優しいイエロー */
        .status-2 { background-color: #d82f2f; } /* 満席: 優しいレッド */
        
        /* 凡例バーをかわいく */
        .legend-bar { 
            display: flex; 
            justify-content: space-around; 
            margin-top: 15px; 
            font-size: 13px; 
            font-weight: bold; 
            background-color: #f6f2ee; /* 背景のトーンに合わせたライトグレージュ */
            padding: 8px;
            border-radius: 10px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; color: #666; }
        .legend-color { width: 16px; height: 16px; border-radius: 5px; border: 1px solid rgba(0,0,0,0.1); }

        /* 🔄 180度反転させた座席配置のCSS（元の座標を完全維持） */
        #t1{top:38%;left:26.5%;width:3.5%;height:4%;} #t2{top:30%;left:26.5%;width:3.5%;height:4%;} #t3{top:22%;left:26.5%;width:3.5%;height:4%;}
        #t4{top:39%;left:34.5%;width:3%;height:5%;} #t5{top:32%;left:34.5%;width:3%;height:5%;} #t6{top:25%;left:34.5%;width:3.5%;height:7%;} #t7{top:18%;left:34.5%;width:3.5%;height:7%;}
        #t8{top:39%;left:40.5%;width:3.5%;height:7%;} #t9{top:32%;left:40.5%;width:3.5%;height:7%;} #t10{top:25%;left:40.5%;width:3.5%;height:7%;} #t11{top:18%;left:40.5%;width:3.5%;height:7%;}
        #t12{top:39%;left:46.5%;width:3.5%;height:7%;} #t13{top:32%;left:46.5%;width:3.5%;height:7%;} #t14{top:25%;left:46.5%;width:3.5%;height:7%;} #t15{top:18%;left:46.5%;width:3.5%;height:7%;}
        #t16{top:39%;left:52.5%;width:3.5%;height:7%;} #t17{top:32%;left:52.5%;width:3.5%;height:7%;} #t18{top:25%;left:52.5%;width:3.5%;height:7%;} #t19{top:18%;left:52.5%;width:3.5%;height:7%;}
        #t20{top:39%;left:58.5%;width:3.5%;height:7%;} #t21{top:32%;left:58.5%;width:3.5%;height:7%;} #t22{top:25%;left:58.5%;width:3.5%;height:7%;} #t23{top:18%;left:58.5%;width:3.5%;height:7%;}
        #t24{top:39%;left:64.5%;width:3.5%;height:7%;} #t25{top:32%;left:64.5%;width:3.5%;height:7%;} #t26{top:25%;left:64.5%;width:3.5%;height:7%;} #t27{top:20%;left:64.5%;width:3.5%;height:5%;}
        #t28{top:39%;left:70.5%;width:3.5%;height:7%;} #t29{top:32%;left:70.5%;width:3.5%;height:7%;} #t30{top:27%;left:70.5%;width:3.5%;height:5%;}

        #t37{top:16.5%;left:78%;width:2.5%;height:7%;transform:rotate(309deg);} #t38{top:26.5%;left:84.5%;width:4%;height:3.5%;transform:rotate(323deg);}
        #t39{top:38.5%;left:90%;width:5%;height:3.5%;transform:rotate(340deg);} #t40{top:47%;left:92%;width:5%;height:3.5%;transform:rotate(352deg);}

        #t42{top:61.5%;left:78%;width:7%;height:3.5%;} #t43{top:54.5%;left:74%;width:4%;height:3.5%;} #t44{top:54.5%;left:83%;width:5%;height:3.5%;}
    
        /* フッターナビをおそろいのかわいさに */
        .footer-nav {
            position: fixed;
            bottom: 10px; 
            left: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.95); 
            display: flex;
            justify-content: space-around;
            border-radius: 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            padding: 5px 0;
            backdrop-filter: blur(5px); 
        }
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            text-decoration: none;
            color: #bbb; 
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            position: relative;
            transition: color 0.3s;
        }
        .nav-item .icon { 
            font-size: 24px; 
            transition: transform 0.3s;
        }
        .nav-item.active { 
            color: #2b1711; /* シックな深い茶・黒系に統一 */
            font-weight: bold; 
        }
        .nav-item.active .icon {
            transform: translateY(-5px) scale(1.1);

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            width: 15px;
            height: 3px;

            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="header">🍽️ 高専品川 学生食堂ナビ<span class="experiment-badge">実証実験中</span></div>

    <!-- ⏰ ヘッダーとタイトルの間に中央寄せで配置（追加しました） -->
    <div class="time-center-container">
        <div id="update-time">--:--</div>
    </div>

    <div class="container">
        <!-- 💡 タイトルエリア（右上個別配置から真ん中に配置を移行したためすっきり化） -->

            <div class="section-title">🪑 空席マップ (混雑度: <span id="congestion_percent">0</span>%)</div>

            <div class="map-wrapper">
                <img src="image3.png" alt="マップ背景" class="map-image">
                <div id="t1" class="table"></div><div id="t2" class="table"></div><div id="t3" class="table"></div><div id="t4" class="table"></div><div id="t5" class="table"></div><div id="t6" class="table"></div><div id="t7" class="table"></div><div id="t8" class="table"></div><div id="t9" class="table"></div><div id="t10" class="table"></div><div id="t11" class="table"></div><div id="t12" class="table"></div><div id="t13" class="table"></div><div id="t14" class="table"></div><div id="t15" class="table"></div><div id="t16" class="table"></div><div id="t17" class="table"></div><div id="t18" class="table"></div><div id="t19" class="table"></div><div id="t20" class="table"></div><div id="t21" class="table"></div><div id="t22" class="table"></div><div id="t23" class="table"></div><div id="t24" class="table"></div><div id="t25" class="table"></div><div id="t26" class="table"></div><div id="t27" class="table"></div><div id="t28" class="table"></div><div id="t29" class="table"></div><div id="t30" class="table"></div><div id="t31" class="table"></div><div id="t32" class="table"></div><div id="t33" class="table"></div><div id="t34" class="table"></div><div id="t35" class="table"></div><div id="t36" class="table"></div><div id="t37" class="table"></div><div id="t38" class="table"></div><div id="t39" class="table"></div><div id="t40" class="table"></div><div id="t41" class="table"></div><div id="t42" class="table"></div><div id="t43" class="table"></div><div id="t44" class="table"></div>
            </div>
            <div class="legend-bar">
                <div class="legend-item"><div class="legend-color status-0"></div>空席</div>
                <div class="legend-item"><div class="legend-color status-1"></div>わずか</div>
                <div class="legend-item"><div class="legend-color status-2"></div>満席</div>
            </div>
        </div>
        
        <div style="text-align:center; padding: 10px 0; color:#aaa; font-size:12px; font-weight: 500;"> データは3秒ごとに自動更新されます</div>
    </div>

<script>
    function loadMobileData() {
        fetch('data.json?' + new Date().getTime())
        .then(res => res.json())
        .then(adminData => {
            let maxScore = 0, currentScore = 0;
            
            if(adminData.seats) {
                Object.keys(adminData.seats).forEach(tableId => {
                    let status = adminData.seats[tableId];
                    let tableElement = document.getElementById(tableId);
                    
                    if (tableElement) { 
                        tableElement.className = 'table status-' + status; 
                        maxScore += 2; 
                        currentScore += status; 
                    }
                });
            }
            document.getElementById('congestion_percent').innerText = maxScore > 0 ? Math.round((currentScore / maxScore) * 100) : 0;
            
            // 💡 3秒ごとのデータ更新に合わせて真ん中のバッジ時刻を自動書き換え
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('update-time').innerHTML = `${hours}:${minutes}`;
            
        })
        .catch(error => console.log("データ読み込みエラー:", error));
    }
    
    loadMobileData(); 
    setInterval(loadMobileData, 3000);
</script>

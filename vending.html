<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>【スマホ版】学食 券売機混雑状況</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 全体の雰囲気を優しく */
        body { 
            margin: 0; padding: 0; 
            background-color: #fffaf0; /* 薄いクリーム色 */
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif; /* 丸ゴシック体 */
            color: #555; /* 少し柔らかい黒 */
            padding-bottom: 80px; 
        }
        
        /* ヘッダーをおそろいのかわいさに */
        .header { 
            background: linear-gradient(135deg, #ffb74d, #ff8a65); /* パステルオレンジのグラデ */
            color: #fff; 
            padding: 18px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: bold; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-radius: 0 0 20px 20px; /* 下だけ丸く */
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }
        
        .container { padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        
        /* タイトルと時刻をまとめるエリア */
        .title-container {
            position: relative;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        /* タイトルをかわいく */
        .section-title { 
            font-size: 19px; 
            font-weight: bold; 
            color: #ff8a65;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 110px; /* 時刻バッジ用の余白 */
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            background-color: #ffb74d;
            border-radius: 4px;
        }
        
        /* 🎀 大きくなって右上に配置された時刻表示エリア */
        #update-time {
            font-size: 18px; 
            color: #ff7043; 
            font-weight: bold;
            background: #fff0f5; /* ほんのり苺ミルク色 */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px; /* ぷっくり丸い形 */
            box-shadow: 0 4px 6px rgba(255, 138, 101, 0.15); 
            border: 2px dashed #ffab91; /* 点線デザイン */
            
            position: absolute;
            right: 5px;
            top: -6px;
            z-index: 10;
        }

        /* 券売機待ちパネルをかわいくリデザイン */
        .total-card { 
            background: #fff; 
            border-radius: 18px; 
            padding: 18px; 
            text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            margin-bottom: 15px; 
            border: 2px solid #fff3e0; 
            transition: all 0.3s ease; 
        }
        /* ふんわりパステルなレベル別カラー */
        .total-card.level-1 { border-color: #a5d6a7; background: #e8f5e9; } 
        .total-card.level-2 { border-color: #ffcc80; background: #fff3e0; } 
        .total-card.level-3 { border-color: #ef9a9a; background: #ffebee; } 
        
        .total-title { font-size: 16px; font-weight: bold; color: #777; margin-bottom: 5px; }
        .total-status { font-size: 26px; font-weight: 900; margin-bottom: 12px; }
        .total-info { display: flex; justify-content: space-around; font-size: 15px; font-weight: bold; }
        .total-info div { background: rgba(255, 255, 255, 0.6); padding: 8px 15px; border-radius: 12px; min-width: 90px; }
        .total-info div span { font-size: 26px; font-weight: 900; color: #ff8a65; }

        .status-img { width: 70px; height: auto; margin-top: 5px; }

        /* トレンドグラフ表示用のカードスタイル */
        .trend-card { background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #fff3e0; }
        .trend-subtitle { font-size: 13px; color: #ff8a65; font-weight: bold; text-align: right; margin-bottom: 8px; }
        .trend-meta { font-size: 12px; color: #777; margin-top: 12px; display: flex; align-items: center; gap: 5px; background: #fffaf0; padding: 8px; border-radius: 10px; }
    
        /* フッターナビをおそろいのかわいさに */
        .footer-nav {
            position: fixed;
            bottom: 10px; 
            left: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.95); 
            display: flex;
            justify-content: space-around;
            border-radius: 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            padding: 5px 0;
            backdrop-filter: blur(5px); 
        }
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            text-decoration: none;
            color: #bbb; 
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            position: relative;
            transition: color 0.3s;
        }
        .nav-item .icon { font-size: 24px; transition: transform 0.3s; }
        .nav-item.active { color: #ff8a65; font-weight: bold; }
        .nav-item.active .icon { transform: translateY(-5px) scale(1.1); }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            width: 15px;
            height: 3px;
            background-color: #ff8a65;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="header">🍽️ 高専品川 学生食堂ナビ<span class="experiment-badge">　実証実験中</span></div>
    <div class="container">
        
        <div>
            <!-- タイトルと右上時刻 -->
            <div class="title-container">
                <div class="section-title">🎫 券売機の混雑状況</div>
                <div id="update-time"></div>
            </div>
            
            <div id="total_card" class="total-card level-1">
                <div class="total-title">現在の券売機エリア</div>
                <div id="total_status" class="total-status" style="color: #4caf50;">🟢 空いています</div>
                
                <div>
                    <img id="vending_image" class="status-img" src="lv1.png" alt="混雑度アイコン">
                </div>

                <div class="total-info" style="margin-top: 15px;">
                    <div>券売機待ち<br><span id="vending_people">0</span> 人</div>
                    <div>購入まで<br>約 <span id="vending_time">0</span> 分</div>
                </div>
            </div>
        </div>

        <div>
            <div class="section-title">📊 混雑する時間帯</div>
            <div class="trend-card">
                <div class="trend-subtitle" id="current_day_text">月曜日</div>
                <canvas id="trendChart" style="width: 100%; height: 200px;"></canvas>
                <div class="trend-meta">
                     <span>この場所の平均滞在時間は <b>15分〜30分</b> です</span>
                </div>
            </div>
        </div>
        
        <div style="text-align:center; padding: 10px 0; color:#aaa; font-size:12px; font-weight: 500;">データは3秒ごとに自動更新されます</div>
    </div>

<script>
    const dayNames = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];
    document.getElementById('current_day_text').innerText = dayNames[new Date().getDay()];

    let trendChart = null;

    // パステルブルー（#90caf9）の人間ピクトグラム（SVG）に変更してさらにかわいく！
    const humanImage = new Image();
    humanImage.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2390caf9"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>';

    humanImage.onload = function() {
        const ctx = document.getElementById('trendChart').getContext('2d');
        
        const humanStackPlugin = {
            id: 'humanStackPlugin',
            afterDatasetsDraw(chart) {
                const { ctx, data } = chart;
                const dataset = data.datasets[1]; 
                const meta = chart.getDatasetMeta(1);
                
                ctx.save();
                meta.data.forEach((bar, index) => {
                    const val = dataset.data[index];
                    const count = Math.ceil(val / 10); 
                    
                    const barWidth = bar.width;
                    const x = bar.x - (barWidth / 2); 
                    const baseY = bar.base;          

                    const imgSize = barWidth; 

                    for (let i = 0; i < count; i++) {
                        const y = baseY - ((i + 1) * imgSize * 0.85); 
                        ctx.drawImage(humanImage, x, y, imgSize, imgSize);
                    }
                });
                ctx.restore();
            }
        };

        trendChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [
                    '11:45', '11:50', '11:55', 
                    '12:00', '12:05', '12:10', '12:15', '12:20', '12:25', '12:30', '12:35', '12:40', '12:45', '12:50', '12:55'
                ],
                datasets: [
                    {
                        label: 'ライブ',
                        data: new Array(15).fill(0),
                        backgroundColor: '#ff8a65',  /* ライブバーの色もパステルオレンジに */
                        borderRadius: 5,
                        barPercentage: 0.2, 
                        categoryPercentage: 0.8,
                        order: 1
                    },
                    {
                        label: '通常の混雑度',
                        data: [20, 25, 40, 75, 90, 95, 90, 85, 70, 60, 45, 35, 25, 15, 10], 
                        backgroundColor: 'transparent',
                        barPercentage: 0.85, 
                        categoryPercentage: 0.8,
                        order: 2
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, max: 100, display: false },
                    x: {
                        grid: { display: false },
                        ticks: {
                            font: { size: 10, weight: 'bold' },
                            color: '#aaa',
                            callback: function(val, index) {
                                const label = this.getLabelForValue(val);
                                return ['11:45', '12:00', '12:15', '12:30', '12:45', '13:00'].includes(label) ? label : '';
                            },
                            maxRotation: 0,
                            minRotation: 0
                        }
                    }
                }
            },
            plugins: [humanStackPlugin]
        });

        loadMobileData(); 
        setInterval(loadMobileData, 3000);
    };

    function loadMobileData() {
        if (!trendChart) return; 

        fetch('data.json?' + new Date().getTime())
        .then(res => res.json())
        .then(adminData => {
            let vending = adminData.vending_machine || { people: 0, time: 0 };
            document.getElementById('vending_people').innerText = vending.people;
            document.getElementById('vending_time').innerText = vending.time;

            let totalCard = document.getElementById('total_card');
            let totalStatus = document.getElementById('total_status');
            let vendingImg = document.getElementById('vending_image');
            
            totalCard.classList.remove('level-1', 'level-2', 'level-3');
            
            let currentLivePercent = Math.min(Math.round((vending.people / 10) * 100), 100);
            if (vending.people > 0 && currentLivePercent < 15) currentLivePercent = 15;
            
            if (vending.people >= 10) {
                totalCard.classList.add('level-3'); 
                totalStatus.innerHTML = "🚨 大変混雑しています"; 
                totalStatus.style.color = "#e57373";
                vendingImg.src = "lv3.png";
            } else if (vending.people >= 5) {
                totalCard.classList.add('level-2'); 
                totalStatus.innerHTML = "⚠️ やや混雑しています"; 
                totalStatus.style.color = "#ffb74d";
                vendingImg.src = "lv2.png";
            } else {
                totalCard.classList.add('level-1'); 
                totalStatus.innerHTML = "🟢 空いています"; 
                totalStatus.style.color = "#81c784";
                vendingImg.src = "lv1.png";
            }

            let now = new Date();
            let hour = now.getHours();
            let min = now.getMinutes();
            let targetIndex = -1;

            if (hour === 11 && min >= 45) {
                targetIndex = Math.floor((min - 45) / 5);
            } else if (hour === 12) {
                targetIndex = 3 + Math.floor(min / 5);
            }

            trendChart.data.datasets[0].data = new Array(15).fill(0);
            if (targetIndex >= 0 && targetIndex < 15) {
                trendChart.data.datasets[0].data[targetIndex] = currentLivePercent;
            }
            
            trendChart.update();

            // 💡 3秒ごとのデータ更新に合わせて右上のバッジ時刻も自動更新
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('update-time').innerHTML = `  ${hours}:${minutes}`;
        })
        .catch(error => console.log("データ読み込みエラー:", error));
    }
</script>

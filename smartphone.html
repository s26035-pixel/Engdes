<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>【スマホ版】学食 混雑状況</title>
    <style>
        /* 全体の雰囲気を優しく */
        body { 
            margin: 0; padding: 0; 
            background-color: #efede8; /* 薄いクリーム色 */
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif; /* 丸ゴシック体 */
            color: #555; /* 少し柔らかい黒 */
            padding-bottom: 80px; 
        }
        
        /* ヘッダーをおそろいのかわいさに */
        .header { 
            background: linear-gradient(135deg, #eceae9, #f6f2ee); /* グレージュ系のグラデ */
            color: #ee9c59; 
            padding: 18px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: bold; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-radius: 0 0 20px 20px; /* 下だけ丸く */
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }
        
        .container { padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        
        /* タイトルエリア */
        .title-area { 
            position: relative;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        /* タイトルをかわいく */
        .section-title { 
            font-size: 19px; 
            font-weight: bold; 
            color: #ff8a65;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            background-color: #eac48c;
            border-radius: 4px;
        }
        
        /* ⏰ 時刻バッジを真ん中に配置するためのラッパー */
        .time-center-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: -5px;
            width: 100%;
        }

        /* 🎀 真ん中に出てくる時刻表示エリア */
        #update-time {
            font-size: 24px; 
            color: #060302; 
            font-weight: 900;
            background: #f5faf9; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 30px; 
            border-radius: 20px; 
            box-shadow: 0 4px 6px rgba(255, 138, 101, 0.15); 
            border: 2.5px dashed #060302; 
            min-width: 80px; 
            text-align: center;
            z-index: 10;
        }

        /* 券売機待ちパネル */
        .total-card { 
            background: #fff; 
            border-radius: 18px; 
            padding: 18px; 
            text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            margin-bottom: 15px; 
            border: 2px solid #e9e5dd; 
            transition: all 0.3s ease; 
        }
        .total-card.level-1 { border-color: #68ca6b; background: #fff; } 
        .total-card.level-2 { border-color: #eebe5f; background: #fff; } 
        .total-card.level-3 { border-color: #e57373; background: #fff; } 
        
        .total-title { font-size: 16px; font-weight: bold; color: #777; margin-bottom: 5px; }
        .total-status { font-size: 26px; font-weight: 900; margin-bottom: 12px; }
        .total-info { display: flex; justify-content: space-around; font-size: 15px; font-weight: bold; }
        .total-info div { background: #f6f2ee; padding: 8px 15px; border-radius: 12px; min-width: 90px; color: #555; }
        .total-info div span { font-size: 26px; font-weight: 900; color: #0e0908; }

        /* 提供状況カードのデザイン */
        .card-row { display: flex; gap: 12px; }
        .card { 
            flex: 1; 
            background: #fff; 
            border-radius: 18px; 
            border-top: 6px solid; 
            padding: 15px 10px; 
            text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
        }
        .card.orange { border-color: #eebe5f; } 
        .card.green { border-color: #68ca6b; }
        
        .card-title { font-weight: bold; margin-bottom: 8px; font-size: 16px; color: #444; }
        .card-time { font-size: 26px; font-weight: 900; color: #0e0908; }
        .card-wait { font-size: 13px; margin-top: 5px; font-weight: bold; color: #888; transition: color 0.5s ease; }
        .status-img { width: 60px; height: auto; margin-top: 8px; }
        
        /* 売り切れ情報ボックス */
        .soldout-box { 
            background: #fff; 
            border-radius: 18px; 
            border-top: 6px solid #ffffff; 
            padding: 18px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            border-left: 1px solid #fff3e0;
            border-right: 1px solid #fff3e0;
            border-bottom: 1px solid #fff3e0;
        }
        .soldout-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px dashed #e9e5dd; 
            padding: 10px 4px; 
            font-size: 15px; 
            font-weight: bold; 
            color: #555;
        }
        .soldout-item:last-child { border-bottom: none; }
        .badge { 
            background: #0b0a0a; 
            color: #fff; 
            padding: 3px 10px; 
            border-radius: 20px; 
            font-size: 11px; 
            box-shadow: 0 2px 4px rgba(239, 154, 154, 0.3);
        }
        
        /* マップ領域 */
        .map-box { background: #fff; border-radius: 18px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e9e5dd; }
        .map-wrapper { position: relative; width: 100%; display: block; }
        .map-image { width: 100%; height: auto; display: block; border-radius: 12px; }
        .table { position: absolute; border: 1px solid #222; border-radius: 3px; transition: background-color 0.5s ease; box-sizing: border-box; }
        
        /* マップの状況色も少しパステル寄りにマイルド化 */
        .status-0 { background-color: #4a90e2; } /* 優しい青 */
        .status-1 { background-color: #eebe5f; } /* 優しい黄 */
        .status-2 { background-color: #e57373; } /* 優しい赤 */
        
        .legend-bar { display: flex; justify-content: space-around; margin-top: 15px; font-size: 13px; font-weight: bold; color: #666; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #555; }

        /* フッターナビをおそろいのかわいさに */
        .footer-nav {
            position: fixed;
            bottom: 10px; 
            left: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.95); 
            display: flex;
            justify-content: space-around;
            border-radius: 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            padding: 5px 0;
            backdrop-filter: blur(5px); 
        }
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            text-decoration: none;
            color: #bbb; 
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            position: relative;
            transition: color 0.3s;
        }
        .nav-item .icon { font-size: 24px; transition: transform 0.3s; }
        .nav-item.active { color: #2b1711; font-weight: bold; }
        .nav-item.active .icon { transform: translateY(-5px) scale(1.1); }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            width: 15px;
            height: 3px;
            background-color: #ede4e1;
            border-radius: 2px;
        }

        /* 座席配置のCSS（元の座標を完全維持） */
        #t1{top:58%;left:70%;width:3.5%;height:4%;} #t2{top:66%;left:70%;width:3.5%;height:4%;} #t3{top:74%;left:70%;width:3.5%;height:4%;}
        #t4{top:54%;left:62%;width:3.5%;height:7%;} #t5{top:61%;left:62%;width:3.5%;height:7%;} #t6{top:68%;left:62%;width:3.5%;height:7%;} #t7{top:75%;left:62%;width:3.5%;height:7%;}
        #t8{top:54%;left:56%;width:3.5%;height:7%;} #t9{top:61%;left:56%;width:3.5%;height:7%;} #t10{top:68%;left:56%;width:3.5%;height:7%;} #t11{top:75%;left:56%;width:3.5%;height:7%;}
        #t12{top:54%;left:50%;width:3.5%;height:7%;} #t13{top:61%;left:50%;width:3.5%;height:7%;} #t14{top:68%;left:50%;width:3.5%;height:7%;} #t15{top:75%;left:50%;width:3.5%;height:7%;}
        #t16{top:54%;left:44%;width:3.5%;height:7%;} #t17{top:61%;left:44%;width:3.5%;height:7%;} #t18{top:68%;left:44%;width:3.5%;height:7%;} #t19{top:75%;left:44%;width:3.5%;height:7%;}
        #t20{top:54%;left:38%;width:3.5%;height:7%;} #t21{top:61%;left:38%;width:3.5%;height:7%;} #t22{top:68%;left:38%;width:3.5%;height:7%;} #t23{top:75%;left:38%;width:3.5%;height:7%;}
        #t24{top:54%;left:32%;width:3.5%;height:7%;} #t25{top:61%;left:32%;width:3.5%;height:7%;} #t26{top:68%;left:32%;width:3.5%;height:7%;} #t27{top:75%;left:32%;width:3.5%;height:5%;}
        #t28{top:54%;left:26%;width:3.5%;height:7%;} #t29{top:61%;left:26%;width:3.5%;height:7%;} #t30{top:68%;left:26%;width:3.5%;height:5%;}
        #t31{top:54%;left:20%;width:3.5%;height:7%;} #t32{top:61%;left:20%;width:3.5%;height:5%;}
        #t33{top:83%;left:66%;width:2.5%;height:7%;transform:rotate(68deg);} #t34{top:86%;left:55%;width:2.5%;height:7%;transform:rotate(82deg);}
        #t35{top:86%;left:41.5%;width:2.5%;height:7%;transform:rotate(99deg);} #t36{top:83%;left:30.5%;width:2.5%;height:7%;transform:rotate(113deg);}
        #t37{top:76.5%;left:19.5%;width:2.5%;height:7%;transform:rotate(129deg);} #t38{top:70%;left:11.5%;width:4%;height:3.5%;transform:rotate(143deg);}
        #t39{top:58%;left:5%;width:5%;height:3.5%;transform:rotate(160deg);} #t40{top:49.5%;left:3%;width:5%;height:3.5%;transform:rotate(172deg);}
        #t41{top:34%;left:3%;width:5%;height:3.5%;transform:rotate(190deg);}
        #t42{top:35%;left:15%;width:7%;height:3.5%;} #t43{top:42%;left:22%;width:4%;height:3.5%;} #t44{top:42%;left:12%;width:5%;height:3.5%;}
    </style>
</head>
<body>
    <div class="header">🍽️ 高専品川 学生食堂ナビ<span class="experiment-badge"> 実証実験中</span></div>
    <div class="container">
        
        <!-- ⏰ 中央寄せのリアルタイム更新時刻バッジ -->
        <div class="time-center-container">
            <div id="update-time">--:--</div>
        </div>
        
        <!-- 券売機の待ち状況パネル -->
        <div>
            <div class="section-title">🎫 券売機の混雑状況</div>
            <div id="total_card" class="total-card level-1">
                <div class="total-title">現在の券売機エリア</div>
                <div id="total_status" class="total-status" style="color: #68ca6b;">🟢 空いています</div>
                <div class="total-info">
                    <div>券売機待ち<br><span id="vending_people">0</span> 人</div>
                    <div>購入まで<br>約 <span id="vending_time">0</span> 分</div>
                </div>
            </div>
        </div>

        <!-- 提供状況（麺・丼） -->
        <div>
            <div class="section-title">🕒 メニュー別 提供状況</div>
            <div class="card-row">
                <div class="card orange">
                    <div class="card-title">🍚 丼もの</div>
                    <div class="card-time"><span id="don_time">0</span>分</div>
                    <div class="card-wait" id="don_wait_text"><span id="don_people">0</span>人待ち</div>
                    <img id="don_image" class="status-img" src="lv1.png" alt="">
                </div>
                <div class="card green">
                    <div class="card-title">🍜 麺類</div>
                    <div class="card-time"><span id="noodle_time">0</span>分</div>
                    <div class="card-wait" id="noodle_wait_text"><span id="noodle_people">0</span>人待ち</div>
                    <img id="noodle_image" class="status-img" src="lv1.png" alt="">
                </div>
            </div>
        </div>
        
        <!-- 売り切れ情報 -->
        <div>
            <div class="section-title">⚠️ 売り切れ情報 ⚠️</div>
            <div class="soldout-box" id="soldout_container"></div>
        </div>
        
        <!-- 空席マップ -->
        <div>
            <div class="section-title">🪑 空席マップ (混雑度: <span id="congestion_percent">0</span>%)</div>
            <p style="font-size:12px; color:#888; margin:5px 0 10px 0; font-weight: 500;">※画像はピンチアウトで拡大できます</p>
            <div class="map-box">
                <div class="map-wrapper">
                    <img src="image3.png" alt="マップ背景" class="map-image">
                    <div id="t1" class="table"></div><div id="t2" class="table"></div><div id="t3" class="table"></div><div id="t4" class="table"></div><div id="t5" class="table"></div><div id="t6" class="table"></div><div id="t7" class="table"></div><div id="t8" class="table"></div><div id="t9" class="table"></div><div id="t10" class="table"></div><div id="t11" class="table"></div><div id="t12" class="table"></div><div id="t13" class="table"></div><div id="t14" class="table"></div><div id="t15" class="table"></div><div id="t16" class="table"></div><div id="t17" class="table"></div><div id="t18" class="table"></div><div id="t19" class="table"></div><div id="t20" class="table"></div><div id="t21" class="table"></div><div id="t22" class="table"></div><div id="t23" class="table"></div><div id="t24" class="table"></div><div id="t25" class="table"></div><div id="t26" class="table"></div><div id="t27" class="table"></div><div id="t28" class="table"></div><div id="t29" class="table"></div><div id="t30" class="table"></div><div id="t31" class="table"></div><div id="t32" class="table"></div><div id="t33" class="table"></div><div id="t34" class="table"></div><div id="t35" class="table"></div><div id="t36" class="table"></div><div id="t37" class="table"></div><div id="t38" class="table"></div><div id="t39" class="table"></div><div id="t40" class="table"></div><div id="t41" class="table"></div><div id="t42" class="table"></div><div id="t43" class="table"></div><div id="t44" class="table"></div>
                </div>
                <div class="legend-bar">
                    <div class="legend-item"><div class="legend-color status-0"></div>空席</div>
                    <div class="legend-item"><div class="legend-color status-1"></div>わずか</div>
                    <div class="legend-item"><div class="legend-color status-2"></div>満席</div>
                </div>
            </div>
        </div>
        <div style="text-align:center; padding: 10px 0; color:#aaa; font-size:12px; font-weight: 500;">データは3秒ごとに自動更新されます</div>
    </div>

<script>
    function padZero(num) {
        return num.toString().padStart(2, '0');
    }

    function loadMobileData() {
        Promise.all([
            fetch('data.json?' + new Date().getTime()).then(res => res.json()),
            fetch('menu.json?' + new Date().getTime()).then(res => res.json()),
            fetch('kitchen_api.php?' + new Date().getTime()).then(res => res.json())
        ])
        .then(([adminData, menuData, ordersData]) => {
            
            // ==========================================
            // ① 券売機の待ち状況表示 (vending_machine)
            // ==========================================
            let vending = adminData.vending_machine || { people: 0, time: 0 };
            document.getElementById('vending_people').innerText = vending.people;
            document.getElementById('vending_time').innerText = vending.time;

            let totalCard = document.getElementById('total_card'), totalStatus = document.getElementById('total_status');
            totalCard.classList.remove('level-1', 'level-2', 'level-3');
            
            if (vending.people >= 10) {
                totalCard.classList.add('level-3'); totalStatus.innerHTML = "🚨 大変混雑しています"; totalStatus.style.color = "#e57373";
            } else if (vending.people >= 5) {
                totalCard.classList.add('level-2'); totalStatus.innerHTML = "⚠️ やや混雑しています"; totalStatus.style.color = "#eebe5f";
            } else {
                totalCard.classList.add('level-1'); totalStatus.innerHTML = "🟢 空いています"; totalStatus.style.color = "#68ca6b";
            }

            // ==========================================
            // ② 提供時間の自動計算 (kitchen_api.php)
            // ==========================================
            let autoDonPeople = 0;    let autoDonTimeSec = 0;
            let autoNoodlePeople = 0; let autoNoodleTimeSec = 0;

            if (Array.isArray(ordersData)) {
                ordersData.forEach(order => {
                    if (order.type === 'don') { autoDonPeople += 1; autoDonTimeSec += (order.cook_time || 0); } 
                    else if (order.type === 'noodle') { autoNoodlePeople += 1; autoNoodleTimeSec += (order.cook_time || 0); }
                });
            }

            let finalDonTime = Math.ceil(autoDonTimeSec / 60) + (adminData.don?.time || 0);
            let finalNoodleTime = Math.ceil(autoNoodleTimeSec / 60) + (adminData.noodle?.time || 0);

            document.getElementById('don_people').innerText = autoDonPeople; document.getElementById('don_time').innerText = finalDonTime;
            document.getElementById('noodle_people').innerText = autoNoodlePeople; document.getElementById('noodle_time').innerText = finalNoodleTime;

            const THRESHOLD_LV2 = 5, THRESHOLD_LV3 = 10, COLOR_LV2 = '#ffb74d', COLOR_LV3 = '#e57373';
            let donImg = document.getElementById('don_image'), donText = document.getElementById('don_wait_text');
            if (autoDonPeople >= THRESHOLD_LV3) { donImg.src = 'lv3.png'; donText.style.color = COLOR_LV3; }
            else if (autoDonPeople >= THRESHOLD_LV2) { donImg.src = 'lv2.png'; donText.style.color = COLOR_LV2; }
            else { donImg.src = 'lv1.png'; donText.style.color = '#ffb74d'; }

            let noodleImg = document.getElementById('noodle_image'), noodleText = document.getElementById('noodle_wait_text');
            if (autoNoodlePeople >= THRESHOLD_LV3) { noodleImg.src = 'lv3.png'; noodleText.style.color = COLOR_LV3; }
            else if (autoNoodlePeople >= THRESHOLD_LV2) { noodleImg.src = 'lv2.png'; noodleText.style.color = COLOR_LV2; }
            else { noodleImg.src = 'lv1.png'; noodleText.style.color = '#a5d6a7'; }

            // ==========================================
            // ③ 売り切れ情報の表示 (本日の曜日でフィルター)
            // ==========================================
            let soldoutContainer = document.getElementById('soldout_container');
            soldoutContainer.innerHTML = ''; 
            let soldoutCount = 0;
            let today = new Date().getDay();

            if (Array.isArray(menuData)) {
                menuData.forEach(menu => {
                    if (menu.available_days && menu.available_days.includes(today)) {
                        if (menu.soldout === true) {
                            soldoutContainer.innerHTML += `
                                <div class="soldout-item">
                                    <span>${menu.name}</span><span class="badge">売り切れ</span>
                                </div>`;
                            soldoutCount++;
                        }
                    }
                });
            }

            if (soldoutCount === 0) {
                soldoutContainer.innerHTML = '<div style="text-align:center; color:#888; font-size:14px; padding:10px 0;">🎉 現在売り切れはありません</div>';
            }
            
            // ==========================================
            // ④ 空席マップの表示 (data.json)
            // ==========================================
            let maxScore = 0, currentScore = 0;
            if(adminData.seats) {
                Object.keys(adminData.seats).forEach(tableId => {
                    let status = adminData.seats[tableId]; let tableElement = document.getElementById(tableId);
                    if (tableElement) { tableElement.className = 'table status-' + status; maxScore += 2; currentScore += status; }
                });
            }
            document.getElementById('congestion_percent').innerText = maxScore > 0 ? Math.round((currentScore / maxScore) * 100) : 0;

            // 💡 3秒ごとの自動更新に合わせて中央のバッジ時刻を自動書き換え
            let now = new Date();
            let timeStr = padZero(now.getHours()) + ':' + padZero(now.getMinutes());
            document.getElementById('update-time').innerHTML = `${timeStr}`;
        })
        .catch(error => console.log("データ読み込みエラー:", error));
    }
    loadMobileData(); setInterval(loadMobileData, 3000);
</script>
